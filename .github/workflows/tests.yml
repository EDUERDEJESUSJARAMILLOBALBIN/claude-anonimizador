name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      # A failing system must not cancel the others: we want all four results
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e 'engine[dev]'
      # No Keychain in CI: the key goes to a temporary file
      - run: ANONYMIZER_HOME="$RUNNER_TEMP/state" pytest -q engine
