[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymizer"
version = "0.2.0"
description = "Local engine of the Anonymizer plugin for Claude Code"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "openpyxl==3.1.5",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "..", "tests"]
